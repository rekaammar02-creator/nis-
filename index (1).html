<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIS Learning Hub – prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#0f1b33;--mute:#5b6679;--line:#dfe5f0;--navy:#04214a;--gold:#e5a812;--ok:#1b8a5a;--bad:#c2372f;--chip:#e9eef8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2f;--ink:#eef2fb;--mute:#9aa6bd;--line:#26324b;--navy:#0a2e66;--gold:#f0b92e;--ok:#4cc38a;--bad:#ff7b72;--chip:#1c2740;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2f;--ink:#eef2fb;--mute:#9aa6bd;--line:#26324b;--navy:#0a2e66;--gold:#f0b92e;--ok:#4cc38a;--bad:#ff7b72;--chip:#1c2740;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Cairo,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header b{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;font-weight:800}
header div{flex:1;line-height:1.2}
.tabs{display:flex;gap:8px;padding:12px 20px 0;overflow-x:auto}
button,input,select,textarea{font:inherit;color:inherit}
.tabs button,.chips button{border:0;background:var(--chip);padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--navy);color:#fff}
button:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{padding:20px;max-width:820px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px;font-weight:800}h2{font-size:20px;margin:20px 0 10px;font-weight:800}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card,.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
li.row[onclick]{cursor:pointer}
.t{font-weight:600}.m{font-size:14px;color:var(--mute)}
.tag{font-size:13px;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--chip);white-space:nowrap}
.tag.ok{background:var(--ok);color:#fff}
label{display:grid;gap:4px;margin:12px 0;font-weight:600;font-size:15px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pri{border:0;background:var(--navy);color:#fff;padding:11px 22px;border-radius:12px;font-weight:800;cursor:pointer}
.ghost{border:1px solid var(--line);background:none;padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.err{color:var(--bad);min-height:1.4em;margin:6px 0;font-weight:600}
.lg{max-width:420px;margin:7vh auto 0}
.chips{display:flex;gap:8px;margin:14px 0 4px}
img{max-width:100%;border-radius:12px;margin:10px 0;display:block}
.gr{border-inline-start:6px solid var(--ok);margin:12px 0}.gr strong{font-size:28px}
.wrap{overflow-x:auto}
.tt{border-spacing:4px;width:100%;min-width:640px;text-align:center}
.tt td,.tt th{padding:12px 4px;border-radius:8px;font-weight:600;font-size:14px;color:#0f1b33}
.tt th{background:var(--navy);color:#fff}.tt .d{background:var(--navy);color:var(--gold)}.tt .br{width:14px;padding:0;background:none}
@media (max-width:600px){main{padding:14px}h1{font-size:22px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
var K="nis-hub-v1",D,me=null,view="a",sel=null,mode="in",cur=null,mem={};
var SUBJ=["Arabic","Islamic Religion","ICT","French","Global Perspectives","Science","Arabic Social Studies","English","Math"];
var TT={Su:["Math","Math","Eng","Eng","SSA","ICT","Sci","Sci"],Mo:["REL","Eng","Eng","SSA","AR","AR","PE-M Support","PE"],Tu:["Math","Math","AR","AR","Eng","Eng","Sci","ICT"],We:["SSA","GP","Eng","REL","Sci","Sci","FL","FL"],Th:["AR","AR","FL","FL","Math","Math","ART Support","Eng"]};
var COL={Math:"#f6e3a8",Eng:"#f1cfcc",SSA:"#c5cbe8",ICT:"#e0d3ee",Sci:"#c9e6d1",REL:"#d5d9ef",AR:"#c7e5ee",GP:"#efd0e0",FL:"#dcdcdc",PE:"#d7f0c8"};
function e(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function rd(k){try{return JSON.parse(localStorage.getItem(k))}catch(x){return mem[k]||null}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(x){mem[k]=v;alert("Storage is full. Try a smaller photo.");return false}}
async function sha(s){s="nis:"+s;if(window.crypto&&crypto.subtle){try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}catch(z){}}var h1=3735928559,h2=1103547991;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}return "f"+(h1>>>0).toString(16)+(h2>>>0).toString(16)}
function $(i){return document.getElementById(i)}
function er(t){var x=$("er");if(x)x.textContent=t}
function U(){return D.users.filter(function(x){return x.u==me})[0]}
function nm(u){var x=D.users.filter(function(y){return y.u==u})[0];return x?x.n:u}
function sub(a){return D.subs.filter(function(s){return s.a==a&&s.u==me})[0]}
function R(){$("root").innerHTML=me?app():login()}
function login(){var up=mode=="up";return '<div class="lg card"><h1>NIS Learning Hub</h1><p class="m">Prototype. Sign in or create an account.</p><div class="chips"><button aria-pressed="'+!up+'" onclick="mode=\'in\';R()">Sign in</button><button aria-pressed="'+up+'" onclick="mode=\'up\';R()">Create account</button></div>'+(up?'<label>Full name<input id="n"></label>':'')+'<label>Username<input id="u" autocapitalize="none" autocomplete="username"></label><label>Password<input id="p" type="password" autocomplete="'+(up?"new-password":"current-password")+'"></label>'+(up?'<label>I am a<select id="r" onchange="$(\'cw\').hidden=this.value!=\'teacher\'"><option value="student">Student</option><option value="teacher">Teacher</option></select></label><label id="cw" hidden>Teacher code<input id="c"></label>':'')+'<p class="err" id="er" role="alert"></p><button class="pri" onclick="'+(up?"doUp()":"doIn()")+'">'+(up?"Create account":"Sign in")+'</button><p class="m">Demo accounts: student1 or teacher1, password demo123. New teachers need the code TEACH2026.</p></div>'}
async function doIn(){var u=$("u").value.trim().toLowerCase(),h=await sha($("p").value),x=D.users.filter(function(y){return y.u==u&&y.h==h})[0];if(!x){er("Wrong username or password.");return}me=u;view="a";sel=null;try{sessionStorage.setItem(K+"me",u)}catch(z){}R()}
async function doUp(){var n=$("n").value.trim(),u=$("u").value.trim().toLowerCase(),p=$("p").value,r=$("r").value;
if(!n||!/^[a-z0-9._-]{3,}$/.test(u)){er("Enter your name and a username of 3 or more letters or numbers.");return}
if(p.length<6){er("Use a password with at least 6 characters.");return}
if(D.users.some(function(y){return y.u==u})){er("That username is taken.");return}
if(r=="teacher"&&$("c").value.trim()!="TEACH2026"){er("Wrong teacher code.");return}
D.users.push({u:u,h:await sha(p),n:n,role:r});if(wr(K,D)){me=u;view="a";try{sessionStorage.setItem(K+"me",u)}catch(z){}R()}}
function out(){me=null;sel=null;try{sessionStorage.removeItem(K+"me")}catch(z){}R()}
function app(){var u=U(),t=u.role=="teacher",tabs=t?[["a","Assignments"],["m","Marking"],["t","Timetable"]]:[["a","Assignments"],["g","My grades"],["t","Timetable"]];
var body=view=="t"?tt():t?(view=="m"?mark():tAs()):(view=="g"?grades():(sel?detail():sAs()));
return '<header><b>NIS</b><div><strong>'+e(u.n)+'</strong><div class="m">'+(t?"Teacher":"Student")+'</div></div><button class="ghost" onclick="out()">Log out</button></header><div class="tabs">'+tabs.map(function(x){return '<button aria-pressed="'+(view==x[0])+'" onclick="view=\''+x[0]+'\';sel=null;R()">'+x[1]+'</button>'}).join("")+'</div><main>'+body+'</main>'}
function row(a,tag,ok){return '<li class="row" tabindex="0" role="button" onkeydown="if(event.key==\'Enter\')this.click()" onclick="sel='+a.id+';R()"><div><div class="t">'+e(a.t)+'</div><div class="m">'+e(a.s)+'</div></div><span class="tag '+ok+'">'+tag+'</span></li>'}
function sAs(){return '<h2>Your assignments</h2><ul>'+D.as.map(function(a){var s=sub(a.id),g=s&&s.sc!=null;return row(a,g?s.sc+"/100":s?"Submitted":"To do",g?"ok":"")}).join("")+'</ul>'}
function detail(){var a=D.as.filter(function(x){return x.id==sel})[0],s=sub(a.id),g=s&&s.sc!=null;cur=null;
return '<button class="ghost" onclick="sel=null;R()">Back</button><h2>'+e(a.t)+'</h2><p class="m">'+e(a.s)+'</p><p>'+e(a.d)+'</p>'+(g?'<div class="card gr"><strong>'+s.sc+'/100</strong><p>'+e(s.fb||"No feedback yet.")+'</p></div>':'')+'<label>Your answer<textarea id="tx" rows="5" dir="auto">'+e(s?s.tx:"")+'</textarea></label><label>Photo of your work<input id="im" type="file" accept="image/*" onchange="pv(this)"></label><img id="pvw" alt="Preview of your photo" '+(s&&s.im?'src="'+e(s.im)+'"':'hidden')+'><p class="err" id="er" role="alert"></p>'+(g?'<p class="m">This work is graded, so it is locked.</p>':'<button class="pri" onclick="send('+a.id+')">'+(s?"Resubmit":"Submit")+'</button>')}
function shrink(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
async function pv(inp){var f=inp.files[0];if(!f)return;try{cur=await shrink(f);var p=$("pvw");p.src=cur;p.hidden=false;er("")}catch(x){er("Could not read that photo. Try another one.")}}
function send(id){var tx=$("tx").value.trim(),o=sub(id),im=cur||(o&&o.im)||null;if(!tx&&!im){er("Add some text or a photo first.");return}
D.subs=D.subs.filter(function(s){return!(s.a==id&&s.u==me)});D.subs.push({a:id,u:me,tx:tx,im:im,at:Date.now()});if(wr(K,D)){sel=null;R()}}
function grades(){var g=D.subs.filter(function(s){return s.u==me&&s.sc!=null});if(!g.length)return '<h2>My grades</h2><p class="m">No graded work yet. When a teacher marks your work, it appears here.</p>';
var avg=Math.round(g.reduce(function(a,s){return a+s.sc},0)/g.length);
return '<h2>My grades</h2><div class="card gr"><div class="m">Average</div><strong>'+avg+'%</strong></div><ul>'+g.map(function(s){var a=D.as.filter(function(x){return x.id==s.a})[0]||{t:"Assignment",s:""};return '<li class="card"><div class="row" style="border:0;padding:0"><div><div class="t">'+e(a.t)+'</div><div class="m">'+e(a.s)+'</div></div><span class="tag ok">'+s.sc+'/100</span></div><p>'+e(s.fb||"No feedback.")+'</p></li>'}).join("")+'</ul>'}
function tAs(){return '<h2>New assignment</h2><div class="card"><label>Title<input id="nt"></label><label>Subject<select id="ns">'+SUBJ.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select></label><label>Instructions<textarea id="nd" rows="3"></textarea></label><p class="err" id="er" role="alert"></p><button class="pri" onclick="addA()">Publish assignment</button></div><h2>Published</h2><ul>'+D.as.map(function(a){return '<li class="row"><div><div class="t">'+e(a.t)+'</div><div class="m">'+e(a.s)+'</div></div><span class="tag">'+D.subs.filter(function(s){return s.a==a.id}).length+' submitted</span></li>'}).join("")+'</ul>'}
function addA(){var t=$("nt").value.trim();if(!t){er("Give the assignment a title.");return}D.as.push({id:Date.now(),t:t,s:$("ns").value,d:$("nd").value.trim()});if(wr(K,D))R()}
function mark(){if(!D.subs.length)return '<h2>Marking</h2><p class="m">No work yet. Submissions appear here.</p>';
return '<h2>Marking</h2><ul>'+D.subs.map(function(s,j){var a=D.as.filter(function(x){return x.id==s.a})[0]||{t:"Assignment"};
return '<li class="card"><div class="row" style="border:0;padding:0"><div><div class="t">'+e(nm(s.u))+'</div><div class="m">'+e(a.t)+'</div></div><span class="tag '+(s.sc!=null?"ok":"")+'">'+(s.sc!=null?s.sc+"/100":"Needs grading")+'</span></div>'+(s.tx?'<p dir="auto">'+e(s.tx)+'</p>':'')+(s.im?'<img src="'+e(s.im)+'" alt="Photo from '+e(nm(s.u))+'">':'')+'<label>Score out of 100<input type="number" min="0" max="100" id="sc'+j+'" value="'+e(s.sc==null?"":s.sc)+'"></label><label>Feedback<textarea id="fb'+j+'" rows="2">'+e(s.fb||"")+'</textarea></label><p class="err" id="e'+j+'" role="alert"></p><button class="pri" onclick="grade('+j+')">Save grade</button></li>'}).reverse().join("")+'</ul>'}
function grade(j){var v=parseFloat($("sc"+j).value);if(isNaN(v)||v<0||v>100){$("e"+j).textContent="Enter a score from 0 to 100.";return}D.subs[j].sc=v;D.subs[j].fb=$("fb"+j).value.trim();if(wr(K,D))R()}
function tt(){var h='<h2>Timetable, Year 7B</h2><div class="wrap"><table class="tt"><tr><th></th>';
for(var i=1;i<=8;i++){h+='<th>'+i+'</th>'+(i==4?'<th class="br"></th>':'')}h+='</tr>';
Object.keys(TT).forEach(function(d){h+='<tr><td class="d">'+d+'</td>';var r=TT[d],i=0;while(i<8){var n=1;while(i+n<8&&r[i+n]==r[i]&&(i+n!=4))n++;h+='<td colspan="'+n+'" style="background:'+(COL[r[i]]||"#bcd8ee")+'">'+r[i]+'</td>';i+=n;if(i==4)h+='<td class="br"></td>'}h+='</tr>'});
return h+'</table></div><p class="m">Break after period 4. AR Arabic, Eng English, Sci Science, SSA Arabic Social Studies, REL Islamic Religion, GP Global Perspectives, FL foreign language. Copied from the school timetable; period times left out.</p>'}
(async function(){D=rd(K);if(!D){var h=await sha("demo123");D={users:[{u:"teacher1",h:h,n:"Ms. Demo",role:"teacher"},{u:"student1",h:h,n:"Student Demo",role:"student"}],as:[{id:1,t:"Textbook assessments, pages 19, 24 and 25",s:"Arabic",d:"Solve the exercises. Upload a photo of your work."},{id:2,t:"Lesson notes",s:"Science",d:"Write 3 facts you learned in the lesson."},{id:3,t:"Practice set 2",s:"Math",d:"Show your steps. Photo or text is fine."}],subs:[]};wr(K,D)}
try{var m=sessionStorage.getItem(K+"me");if(m&&D.users.some(function(x){return x.u==m}))me=m}catch(x){}R()})().catch(function(x){$("root").textContent="Could not start: "+x.message});
</script>
</body>
</html>
